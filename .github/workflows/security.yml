name: Security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:

  # Scan the full git history for accidentally committed secrets.
  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history — shallow clone misses old commits
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Scan the repository filesystem and dependencies for known CVEs.
  vulnerability-scan:
    name: Vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          ignore-unfixed: true      # skip CVEs that have no fix available yet
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          format: 'table'
