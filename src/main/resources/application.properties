spring.application.name=aether-ledger

# ---------------------------------------------------------------------------
# DataSource
# ---------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aetherledger}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# ---------------------------------------------------------------------------
# JPA / Hibernate
# Flyway owns schema creation; Hibernate only validates that the mapped
# columns exist.  Never use ddl-auto=update in a production-tracked project.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ---------------------------------------------------------------------------
# Flyway
# Migrations live in src/main/resources/db/migration (the default).
# baseline-on-migrate=false: we start from a clean database; Flyway's
# schema_history table is created fresh on first run.
# ---------------------------------------------------------------------------
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

# ---------------------------------------------------------------------------
# Scheduled reconciliation job
# Set scheduled.enabled=false to disable the background job entirely.
# interval-ms controls how often the job fires (default: every 30 seconds).
# ---------------------------------------------------------------------------
aetherledger.reconciliation.scheduled.enabled=true
aetherledger.reconciliation.interval-ms=30000

# ---------------------------------------------------------------------------
# Outbox relay job
# Set outbox.relay.enabled=false to disable the relay entirely.
# outbox.relay.interval controls how often the relay fires (default: 30 s).
# ---------------------------------------------------------------------------
outbox.relay.enabled=true
outbox.relay.interval=30000

# ---------------------------------------------------------------------------
# AI Insight Engine
# Set ai.insights.enabled=true and configure provider + API key to activate
# language-model-generated reconciliation insights.  The rule-based generator
# is always the fallback; AI failure never breaks the endpoint.
# API key is read from the AI_INSIGHTS_API_KEY environment variable — never
# hard-coded.
# ---------------------------------------------------------------------------
ai.insights.enabled=false
ai.insights.provider=disabled
ai.insights.api-key=${AI_INSIGHTS_API_KEY:}

# ---------------------------------------------------------------------------
# Actuator
# Expose only the health endpoint — no env, no beans, no heap dumps.
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
