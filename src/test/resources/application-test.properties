# ---------------------------------------------------------------------------
# Integration-test profile — Testcontainers PostgreSQL
#
# The datasource URL, username, and password are NOT set here.
# They are injected at runtime by AbstractIntegrationTest via
# @DynamicPropertySource, which pulls live values from the running
# PostgreSQLContainer before the Spring context is initialised.
#
# Flyway is enabled so that V1__baseline_schema.sql (and any future
# migrations) are applied to the container before each test run,
# giving tests the same schema that production sees.
# ---------------------------------------------------------------------------

# Schema is owned by Flyway; Hibernate only validates column presence.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway runs real migrations against the Testcontainers PostgreSQL instance.
spring.flyway.enabled=true

# Keep the pool small for tests — the container handles only one JVM.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# Disable the scheduled reconciliation job so it cannot fire concurrently
# with test setup/teardown and corrupt test state.
aetherledger.reconciliation.scheduled.enabled=false

# Disable the outbox relay job for the same reason — tests that exercise the
# relay call OutboxRelayService directly so they control exactly when it runs.
outbox.relay.enabled=false

# Keep AI insights disabled in tests so all insight assertions hit the
# deterministic rule-based generator and are not order-dependent on a provider.
ai.insights.enabled=false

# Disable the webhook retry job so tests drive WebhookRetryService directly.
webhooks.retry.scheduled.enabled=false
